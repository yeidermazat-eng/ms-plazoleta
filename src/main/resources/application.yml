server:
  port: 8082

spring:
  application:
    name: ms-plazoleta
  datasource:
    url: jdbc:mysql://localhost:3308/plazoleta_core?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

microservices:
  usuarios:
    url: http://localhost:8081
  mensajeria:
    url: http://localhost:8083
  trazabilidad:
    url: http://localhost:8084

security:
  jwt:
    secret: PlazoletaComidasSuperSecretKeyParaFirmarTokensJWT2026!

springdoc:
  swagger-ui:
    path: /swagger-ui.html
